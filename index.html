    <style>
      :root {
        --color-primary: #f29a7d;
        --color-accent: #f27dad;
        --color-background: #f4e9e4;
        --color-text: #000;
        --color-muted: #ccc;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
        overflow: hidden;
      }

      .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        text-align: center;
        padding-inline: 1.25rem;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s ease 0.1s, transform 0.8s ease 0.1s;
      }

      .page.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .intro__heading {
        font-size: clamp(1.5rem, 4.5vw, 2rem);
        font-weight: 700;
        line-height: 1.4;
        margin: 0;
        max-width: 700px;
      }
      .intro__name {
        color: var(--color-primary);
      }
      .intro__links {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 1.25rem;
        flex-wrap: wrap;
      }
      .intro__link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.875rem;
        color: var(--color-accent);
        text-decoration: none;
        background-image: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        background-size: 0% 2px;
        background-repeat: no-repeat;
        background-position: left bottom;
        padding-bottom: 2px;
        transition: background-size 0.3s ease-in-out, opacity 0.2s ease-in-out;
      }
      .intro__link:hover,
      .intro__link:focus {
        opacity: 0.8;
        background-size: 100% 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .intro__link,
        .page {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" id="site">
      <h1 class="intro__heading">
        Hi, I am <span class="intro__name">Nick Hawn</span>, a Software Developer
        Based in Grand Rapids, Michigan.
      </h1>

      <nav class="intro__links" aria-label="Social links">
        <a
          class="intro__link"
          href="https://github.com/nickhawn"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <a
          class="intro__link"
          href="https://www.linkedin.com/in/nickhawn/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
        <a
          class="intro__link"
          href="https://spin.atomicobject.com/author/nick-hawn/"
          target="_blank"
          rel="noopener noreferrer"
          >Latest Blog Posts</a
        >
      </nav>
    </main>

    <script type="module">
      const siteEl = document.getElementById('site');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        siteEl.classList.add('visible');
        document.body.style.overflow = '';
      } else {
        requestAnimationFrame(() => siteEl.classList.add('visible'));
        siteEl.addEventListener('transitionend', () => {
          document.body.style.overflow = '';
        }, { once: true });
      }
    </script>
  </body>
