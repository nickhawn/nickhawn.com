    <style>
      :root {
        --color-primary: #f29a7d;
        --color-accent: #f27dad;
        --color-background: #f4e9e4;
        --color-text: #000;
        --color-muted: #ccc;
        --color-muted-subtle: #aaa;
        --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
        overflow: hidden;
      }

      body.loaded {
        overflow: visible;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: var(--color-background);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }

      .boot-screen.exit {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }

      .boot-steps {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--font-mono);
        font-size: clamp(0.9rem, 2.5vw, 1.15rem);
        user-select: none;
      }

      .boot-step {
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        color: var(--color-muted);
        transition: color 0.3s ease, transform 0.3s ease;
      }

      .boot-step.completed {
        color: var(--color-muted-subtle);
      }

      .boot-step__label {
        position: relative;
      }

      .boot-step.completed .boot-step__label::after {
        content: '✓';
        position: absolute;
        margin-left: 0.25em;
      }

      .boot-step.active {
        color: var(--color-primary);
        font-weight: 600;
        transform: scale(1.05);
      }

      .boot-step.active .boot-step__spinner {
        display: inline-block;
      }

      .boot-step__spinner {
        display: none;
        width: 0.7em;
        height: 0.7em;
        border: 2px solid var(--color-primary);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 0.35em;
        vertical-align: middle;
      }

      .boot-separator {
        color: var(--color-muted);
        font-size: 0.8em;
        transition: color 0.3s ease;
      }

      .boot-separator.completed {
        color: var(--color-muted-subtle);
      }

      .boot-subtitle {
        font-family: var(--font-mono);
        font-size: clamp(0.7rem, 1.8vw, 0.85rem);
        color: var(--color-muted-subtle);
        margin-top: 1rem;
        min-height: 1.4em;
        transition: opacity 0.3s ease;
      }

      .boot-subtitle.typing::after {
        content: '▊';
        animation: blink 0.7s step-end infinite;
        margin-left: 1px;
        color: var(--color-primary);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        text-align: center;
        padding-inline: 1.25rem;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s ease 0.1s, transform 0.8s ease 0.1s;
      }

      .page.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .intro__heading {
        font-size: clamp(1.5rem, 4.5vw, 2rem);
        font-weight: 700;
        line-height: 1.4;
        margin: 0;
        max-width: 700px;
      }
      .intro__name {
        color: var(--color-primary);
      }
      .intro__links {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 1.25rem;
        flex-wrap: wrap;
      }
      .intro__link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.875rem;
        color: var(--color-accent);
        text-decoration: none;
        background-image: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        background-size: 0% 2px;
        background-repeat: no-repeat;
        background-position: left bottom;
        padding-bottom: 2px;
        transition: background-size 0.3s ease-in-out, opacity 0.2s ease-in-out;
      }
      .intro__link:hover,
      .intro__link:focus {
        opacity: 0.8;
        background-size: 100% 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .intro__link,
        .boot-screen,
        .page,
        .boot-step,
        .boot-subtitle {
          transition: none;
        }
        .boot-step__spinner,
        .boot-subtitle.typing::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-screen" id="boot">
      <div class="boot-steps" id="bootSteps"></div>
      <div class="boot-subtitle" id="bootSubtitle"></div>
    </div>

    <main class="page" id="site">
      <h1 class="intro__heading">
        Hi, I am <span class="intro__name">Nick Hawn</span>, a Software Developer
        Based in Grand Rapids, Michigan.
      </h1>

      <nav class="intro__links" aria-label="Social links">
        <a
          class="intro__link"
          href="https://github.com/nickhawn"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <a
          class="intro__link"
          href="https://www.linkedin.com/in/nickhawn/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
        <a
          class="intro__link"
          href="https://spin.atomicobject.com/author/nick-hawn/"
          target="_blank"
          rel="noopener noreferrer"
          >Latest Blog Posts</a
        >
      </nav>
    </main>

    <script type="module">
      const STEPS = [
        { label: 'Explore',   subtitle: 'learning about nick...',    duration: 800 },
        { label: 'Plan',      subtitle: 'gathering blog posts...', duration: 800 },
        { label: 'Implement', subtitle: 'rendering page...',       duration: 800 },
      ];

      const stepsEl = document.getElementById('bootSteps');
      const subtitleEl = document.getElementById('bootSubtitle');
      const bootEl = document.getElementById('boot');
      const siteEl = document.getElementById('site');

      function typeText(el, text, speed = 20) {
        return new Promise((resolve) => {
          if (!text) { resolve(); return; }
          el.textContent = '';
          el.classList.add('typing');
          let i = 0;
          const interval = setInterval(() => {
            el.textContent += text[i];
            i++;
            if (i >= text.length) {
              clearInterval(interval);
              el.classList.remove('typing');
              resolve();
            }
          }, speed);
        });
      }

      function skipBoot() {
        bootEl.remove();
        document.body.classList.add('loaded');
        siteEl.classList.add('visible');
      }

      async function runBoot() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          skipBoot();
          return;
        }

        STEPS.forEach((step, i) => {
          const span = document.createElement('span');
          span.className = 'boot-step';
          span.innerHTML = `<span class="boot-step__spinner"></span><span class="boot-step__label">${step.label}</span>`;
          stepsEl.appendChild(span);

          if (i < STEPS.length - 1) {
            const sep = document.createElement('span');
            sep.className = 'boot-separator';
            sep.textContent = '\u2009→\u2009';
            stepsEl.appendChild(sep);
          }
        });

        const stepEls = stepsEl.querySelectorAll('.boot-step');
        const sepEls = stepsEl.querySelectorAll('.boot-separator');

        for (let i = 0; i < STEPS.length; i++) {
          stepEls[i].classList.add('active');

          await typeText(subtitleEl, STEPS[i].subtitle);

          await new Promise((r) => setTimeout(r, STEPS[i].duration));

          stepEls[i].classList.remove('active');
          stepEls[i].classList.add('completed');
          if (sepEls[i - 1]) sepEls[i - 1].classList.add('completed');
        }

        await new Promise((r) => setTimeout(r, 800));
        bootEl.classList.add('exit');
        bootEl.setAttribute('aria-hidden', 'true');
        document.body.classList.add('loaded');

        await new Promise((r) => setTimeout(r, 200));
        siteEl.classList.add('visible');

        setTimeout(() => bootEl.remove(), 800);
      }

      runBoot();
    </script>
  </body>
