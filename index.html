    <style>
      :root {
        --color-primary: #f29a7d;
        --color-accent: #f27dad;
        --color-background: #f4e9e4;
        --color-text: #000;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
      }
      .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100svh; /* supports mobile viewport units */
        text-align: center;
        padding-inline: 1.25rem; /* 20px -> maintains spacing on very narrow screens */
      }
      .intro__heading {
        font-size: clamp(1.5rem, 4.5vw, 2rem); /* Responsive font size */
        font-weight: 700;
        line-height: 1.4;
        margin: 0;
        max-width: 700px;
      }
      .intro__name {
        color: var(--color-primary);
      }
      .intro__links {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 1.25rem;
        flex-wrap: wrap;
      }
      .intro__link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.875rem;
        color: var(--color-accent);
        text-decoration: none;
        transition: opacity 0.2s ease-in-out;
        position: relative;
      }
      .intro__link::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        transition: width 0.3s ease-in-out;
      }
      .external-icon {
        opacity: 0.7;
      }
      .intro__link:hover,
      .intro__link:focus {
        opacity: 0.8;
      }
      .intro__link:hover::after,
      .intro__link:focus::after {
        width: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .intro__link {
          transition: none;
        }
      }
    </style>
